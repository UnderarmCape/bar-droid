// Top-level build file. Versions follow termux-x11 (AGP 9.3.1 / Gradle 9.8.2) so that
// the :lorie X-server module builds exactly as upstream does.
buildscript {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central mirror (Google-hosted, fast)
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

allprojects {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central mirror (Google-hosted, fast)
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// One ABI per APK. x86_64 (the default) runs natively on the Android emulator: amd64 Debian + amd64 Recoil engine,
// OpenGL in software (llvmpipe). arm64-v8a is the phone build (Adreno via Mesa Freedreno/Turnip):
//   gradlew :app:assembleDebug -PbardroidAbi=arm64-v8a
// Building a single ABI also keeps :lorie's Xorg compile short.
ext.bardroidAbi = (project.findProperty('bardroidAbi') ?: 'x86_64').toString()
if (!(bardroidAbi in ['x86_64', 'arm64-v8a'])) throw new GradleException("bardroidAbi must be x86_64 or arm64-v8a, not ${bardroidAbi}")
subprojects {
    plugins.withId('com.android.library') {
        android.defaultConfig.ndk.abiFilters rootProject.ext.bardroidAbi
    }
    plugins.withId('com.android.application') {
        android.defaultConfig.ndk.abiFilters rootProject.ext.bardroidAbi
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
