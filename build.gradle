// Top-level build file. Versions follow termux-x11 (AGP 9.3.1 / Gradle 9.8.2) so that
// the :lorie X-server module builds exactly as upstream does.
buildscript {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central mirror (Google-hosted, fast)
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:9.3.1'
    }
}

allprojects {
    repositories {
        google()
        maven { url "https://maven-central.storage-download.googleapis.com/maven2/" }   // Maven Central mirror (Google-hosted, fast)
        mavenCentral()
        maven { url "https://jitpack.io" }
    }
}

// Only the 64-bit ARM ABI is meaningful here: the bundled proot, busybox and the Recoil engine
// are all aarch64. Restricting :lorie's native build to it cuts the Xorg compile by 4x.
subprojects {
    plugins.withId('com.android.library') {
        android.defaultConfig.ndk.abiFilters 'arm64-v8a'
    }
    plugins.withId('com.android.application') {
        android.defaultConfig.ndk.abiFilters 'arm64-v8a'
    }
}

tasks.register('clean', Delete) {
    delete rootProject.layout.buildDirectory
}
