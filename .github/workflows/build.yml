# The phone APK (public icon, debug key) and the Lua lint on every push and pull request; the APK as an artifact.
# The laptop checks (tools\laptop-tests.ps1) need BAR's Windows install and stay local (docs/BUILDING.md "Checks").
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Android SDK, NDK and CMake as the project pins them
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Termux:X11 at the pinned commit, with patches/
        run: bash tools/fetch-termux-x11.sh
      - name: The phone APK
        run: bash ./gradlew --no-daemon :app:assembleDebug -PbardroidAbi=arm64-v8a -PbardroidPublic
      - uses: actions/upload-artifact@v4
        with:
          name: bar-droid-phone-debug
          path: app/build/outputs/apk/debug/*.apk

  lua-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua-check
          luacheck --codes app/src/main/assets/bardroid tools
