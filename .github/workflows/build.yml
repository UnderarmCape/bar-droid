# The phone APK (public icon, debug key), the Java checks and the Lua lint on every push and pull request; the APK as
# an artifact. The checks in BAR's real game and lobby (tools\laptop-tests.ps1) need BAR's Windows install and stay
# local (docs/BUILDING.md "Checks"). Action versions as Termux:X11's own workflow uses them at the pinned commit
# (termux-x11/.github/workflows/debug_build.yml), whose native build this one repeats on the same runner image.
name: build

# (on demand and on pull requests, not on every push: the private repository gets a push after every hardening run,
# about 30 a night, and an APK build each time would spend GitHub's free Actions minutes in days and mail a failure
# each time one failed; 2026-11-18, the night it went on GitHub)
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # (a pull request could swap gradle/wrapper/gradle-wrapper.jar, which the build then runs)
      - uses: gradle/actions/wrapper-validation@v6.4.0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
        with:
          # (its default also asks for "tools", the old SDK Tools package the repository no longer has: "Failed to
          # find package 'tools'", and the job stopped there; GitHub, 2026-11-18)
          packages: platform-tools
      - name: Android SDK, NDK and CMake as the project pins them
        run: sdkmanager "platforms;android-34" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"
      - name: Termux:X11 at the pinned commit, with patches/
        run: bash tools/fetch-termux-x11.sh
      - name: The phone APK
        run: bash ./gradlew --no-daemon :app:assembleDebug -PbardroidAbi=arm64-v8a -PbardroidPublic
      - uses: actions/upload-artifact@v7
        with:
          name: bar-droid-phone-debug
          path: app/build/outputs/apk/debug/*.apk

  java-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Downloader, settings merge, updater rollback, gamepad controls, status words
        run: sh tools/java-checks.sh
      - name: launch-bar.sh's build menu switching
        run: sh tools/launch-bar-test.sh
      - name: The PowerShell tools parse
        shell: pwsh
        run: |
          $bad = foreach ($f in Get-ChildItem tools -Filter *.ps1) {
            $errs = $null
            [void][Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errs)
            if ($errs) { "$($f.Name): $($errs[0].Message) (line $($errs[0].Extent.StartLineNumber))" }
          }
          if ($bad) { $bad; exit 1 }

  lua-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: luacheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q lua-check
          luacheck --codes app/src/main/assets/bardroid tools
      - name: lua locals (Lua's 200 in a main chunk)
        run: python3 -I tools/lua-locals.py
