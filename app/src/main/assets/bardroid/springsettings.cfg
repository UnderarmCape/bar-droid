# BAR Droid's starting point for the engine's springsettings.cfg (keys verified against RecoilEngine's CONFIG()
# declarations). Installer.writeGameFiles writes it into the write dir when there is none; after that it only adds
# these keys where the file has none and sets Installer.ALWAYS (the window, audio, memory and cursor setup) at every
# start, so BAR's and the player's own settings stay. launch-bar.sh sets the phone graphics (PHONE_GFX) on top.

# window: borderless window at the X11 screen size (Fullscreen=1 can confuse Termux:X11)
Fullscreen = 0
WindowBorderless = 1
WindowPosX = 0
WindowPosY = 0
XResolutionWindowed = 0
YResolutionWindowed = 0
MinimizeOnFocusLoss = 0
BlockCompositing = 0

# GPU load
VSync = 1
MSAALevel = 0
Shadows = -1
ShadowMapSize = 1024
# 0: the engine renders into some "compress if possible" textures (unit icons atlas, projectile atlas). Freedreno
# then picks a compressed format, which cannot be drawn into: every unit icon was a black square when zoomed out.
CompressTextures = 0
GroundDetail = 40
GrassDetail = 0
UnitLodDist = 150
UnitIconDist = 150
# BAR's minimum (its options slider starts here). Below ~2000 gfx_fire_smoke_gl4 sizes its VBO at
# (MaxParticles - 7000) * 2 + 10000 <= 0, which kills unsynced LuaRules and with it CUS GL4: no units drawn.
MaxParticles = 10000
MaxNanoParticles = 500
Water = 1
BumpWaterRefraction = 0
ROAM = 1
AllowDeferredMapRendering = 0
AllowDeferredModelRendering = 0

# CPU / heat: leave big cores for the sim; raise once thermals are known
WorkerThreadCount = 4
ThreadPinPolicy = none

# keep GL4 drawers on (that is the modern path); flip to 1 only if units fail to draw
ForceDisableGL4 = 0

# BAR (Lua) UI scale: fingers need bigger targets
ui_scale = 1.4

# mouse: the X server draws the pointer on every display frame, so it moves smoothly however slow the lobby or game
# draws (the engine's own cursor moves only once per game frame)
HardwareCursor = 1

# touch: the cursor stays where the last finger was (no edge scrolling), finger double taps are slower than mice
WindowedEdgeMove = 0
FullscreenEdgeMove = 0
DoubleClickTime = 350
# two-finger twist turns the camera in small steps; the cardinal lock would hold it at north/east/south/west
CamSpringLockCardinalDirections = 0

# sound: OpenAL Soft's own output (launch-bar.sh points it at the app's audio FIFO), not SDL audio
UseSDLAudio = 0
snd_device =

# memory: by default the engine keeps every file it reads from the game archive in memory, decompressed, for the
# whole session: ~3.4 GB in a spectated 8v8 on the Fold7, all of it swapped out (only read while loading), and the
# reason Android killed the game in the background. Off, a file read twice is read from the archive again.
VFSCacheArchiveFiles = 0
# and a 512 MB pool reserved for loading images; off, image loads use ordinary memory that is freed afterwards
TextureMemPoolSize = 0

# logging: flush so infolog.txt survives a crash
LogFlushLevel = 20
