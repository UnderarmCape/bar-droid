# bar-droid phase 1 — phone-safe settings for the Recoil engine (keys verified against
# RecoilEngine master CONFIG() declarations). Copied to the write-dir by debian-bootstrap.sh.
# Loosen one line at a time once the game runs. The Termux:X11 window size decides the real
# resolution; keep its "custom" mode at 1280x720 or lower at first.

# window: borderless window at the X11 screen size (Fullscreen=1 can confuse Termux:X11)
Fullscreen = 0
WindowBorderless = 1
WindowPosX = 0
WindowPosY = 0
XResolutionWindowed = 0
YResolutionWindowed = 0
MinimizeOnFocusLoss = 0
BlockCompositing = 0

# GPU load
VSync = 1
MSAALevel = 0
Shadows = -1
ShadowMapSize = 1024
CompressTextures = 1
GroundDetail = 40
GrassDetail = 0
UnitLodDist = 150
UnitIconDist = 150
# BAR's minimum (its options slider starts here). Below ~2000 gfx_fire_smoke_gl4 sizes its VBO at
# (MaxParticles - 7000) * 2 + 10000 <= 0, which kills unsynced LuaRules and with it CUS GL4: no units drawn.
MaxParticles = 10000
MaxNanoParticles = 500
Water = 1
BumpWaterRefraction = 0
ROAM = 1
AllowDeferredMapRendering = 0
AllowDeferredModelRendering = 0

# CPU / heat: leave big cores for the sim; raise once thermals are known
WorkerThreadCount = 4
ThreadPinPolicy = none

# keep GL4 drawers on (that is the modern path); flip to 1 only if units fail to draw
ForceDisableGL4 = 0

# BAR (Lua) UI scale: fingers need bigger targets
ui_scale = 1.4

# mouse: the X server draws the pointer on every display frame, so it moves smoothly however slow the lobby or game
# draws (the engine's own cursor moves only once per game frame)
HardwareCursor = 1

# touch: the cursor stays where the last finger was (no edge scrolling), finger double taps are slower than mice
WindowedEdgeMove = 0
FullscreenEdgeMove = 0
DoubleClickTime = 350
# two-finger twist turns the camera in small steps; the cardinal lock would hold it at north/east/south/west
CamSpringLockCardinalDirections = 0

# sound: OpenAL Soft's own output (launch-bar.sh points it at the app's audio FIFO), not SDL audio
UseSDLAudio = 0
snd_device =

# logging: flush so infolog.txt survives a crash
LogFlushLevel = 20
