apply plugin: 'com.android.application'

// This machine's own settings (local.properties, never committed): the SDK, and optionally the owner's icon and the
// release key below.
def localProps = new Properties()
def localFile = rootProject.file('local.properties')
if (localFile.exists()) localFile.withInputStream { localProps.load(it) }
def releaseKeystore = localProps.getProperty('bardroid.keystore')

android {
    namespace = 'com.underarmcape.bardroid'
    compileSdk = 34
    // Same NDK as :lorie; AGP uses it to strip debug symbols from the packaged .so files.
    ndkVersion = "29.0.14206865"

    defaultConfig {
        applicationId = "com.underarmcape.bardroid"
        minSdk = 28
        targetSdk = 34
        // The version lives in gradle.properties (one place; CHANGELOG.md has an entry for each).
        versionCode = bardroidVersionCode.toInteger()
        versionName = bardroidVersionName
        // ABI filter comes from the root build.gradle (-PbardroidAbi, default x86_64 = emulator build).
        buildConfigField "String", "TARGET_ABI", "\"${rootProject.ext.bardroidAbi}\""
    }

    // proot, busybox and friends live in jniLibs and must be real files on disk so that they can be
    // exec'd (Android 10+ only allows executing files from the app's native library directory).
    packaging.jniLibs.useLegacyPackaging = true
    // The dex files compressed in the APK: from minSdk 28 they were stored as they are, 12.9 MB of the download that
    // compress to 4.6 MB (the release audit, 2026-11-21); Android unpacks them once at install.
    packaging.dex.useLegacyPackaging = true
    // The prebuilt binaries (Termux proot + friends, patchelf'd; static busybox) ship as published: llvm-strip
    // re-lays them out. Only our own build output (libXlorie.so) gets stripped.
    packaging.jniLibs.keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so', '**/libtalloc.so',
                                           '**/libandroid-shmem.so', '**/libbusybox.so',
                                           '**/libvirgl_server.so', '**/libvirglrenderer.so', '**/libepoxy.so',
                                           '**/lib*_angle.so']

    signingConfigs {
        debug {
            // Reproducible dev signing key for test builds (public: anyone can sign with it).
            storeFile = file('bardroid-debug.jks')
            storePassword = 'bardroid'
            keyAlias = 'bardroid'
            keyPassword = 'bardroid'
        }
        // Release builds are the ones that go out: signed with the publisher's own key, named in local.properties
        // (bardroid.keystore, bardroid.keyAlias), passwords from the environment (BARDROID_KEYSTORE_PASSWORD,
        // BARDROID_KEY_PASSWORD if it differs). Without it the release APK is unsigned and named so (-unsigned.apk,
        // for signing elsewhere); "Build APK.bat" refuses to build one.
        if (releaseKeystore) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = System.getenv('BARDROID_KEYSTORE_PASSWORD')
                keyAlias = localProps.getProperty('bardroid.keyAlias', 'bardroid')
                keyPassword = System.getenv('BARDROID_KEY_PASSWORD') ?: System.getenv('BARDROID_KEYSTORE_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            signingConfig = signingConfigs.debug
            minifyEnabled = false
        }
        release {
            signingConfig = releaseKeystore ? signingConfigs.release : null
            minifyEnabled = false
        }
    }

    // Kailil's own (debug) builds carry his edit of BAR's icon (NoDerivatives: never published), from a folder
    // outside the checkout named in local.properties: bardroid.personalRes=C:/Tools/BARANDROID/personal/res.
    // Release builds, debug builds with -PbardroidPublic, and checkouts without it have the project's own icon
    // (res/drawable/ic_fg.xml).
    def personalRes = localProps.getProperty('bardroid.personalRes')
    if (personalRes && file(personalRes).isDirectory() && !project.hasProperty('bardroidPublic')) {
        sourceSets.debug.res.srcDir(personalRes)
    }

    // The phone engine (docs/ENGINE-DEFAULT.md): the engine branch's build of BAR's engine, 42 MB, kept out of the
    // repository. local.properties bardroid.phoneEngine names a folder holding phone-engine/<engine version>/spring and
    // BUILD.txt (tools/phone-engine-release.ps1 makes it); the APK carries it as assets (17 MB compressed) and
    // Installer.installPhoneEngine sets it up on the phone. Without it the APK has BAR's official engine only.
    // -PbardroidPhoneEngine=<folder> (or ORG_GRADLE_PROJECT_bardroidPhoneEngine) names another folder for one build: a
    // build under its gate (tools/engine-gate.ps1) without changing what every other build of this checkout carries.
    def phoneEngine = project.findProperty('bardroidPhoneEngine') ?: localProps.getProperty('bardroid.phoneEngine')
    if (phoneEngine && file("$phoneEngine/phone-engine").isDirectory() && rootProject.ext.bardroidAbi == 'arm64-v8a') {
        sourceSets.main.assets.srcDir(phoneEngine)
    }

    // Each build carries its own ABI's frame pacer (tools/build-pace.py: libbardroid_pace.so for arm64,
    // libbardroid_pace-x86_64.so for the emulator), not the other's too (the release audit, 2026-11-21)
    sourceSets.main.assets.srcDir("src/abi-${rootProject.ext.bardroidAbi}/assets")

    compileOptions.sourceCompatibility = JavaVersion.VERSION_17
    compileOptions.targetCompatibility = JavaVersion.VERSION_17
    buildFeatures.buildConfig = true
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            def target = rootProject.ext.bardroidAbi == 'x86_64' ? 'emulator' : 'phone'
            // debug: a fixed name the launchers install; release: named with the version, as it is published
            def kind = variant.buildType != 'release' ? variant.buildType :
                    bardroidVersionName + (releaseKeystore ? '' : '-unsigned')
            output.outputFileName.set("bar-droid-${target}-${kind}.apk")
        }
    }
}

dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    // (Material Components went 2026-11-21: nothing in the app or Termux:X11 used it; the themes are AppCompat's)
}
