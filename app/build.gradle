apply plugin: 'com.android.application'

android {
    namespace 'com.underarmcape.bardroid'
    compileSdkVersion 34
    // Same NDK as :lorie; AGP uses it to strip debug symbols from the packaged .so files.
    ndkVersion "29.0.14206865"

    defaultConfig {
        applicationId "com.underarmcape.bardroid"
        minSdkVersion 28
        targetSdkVersion 34
        versionCode 2
        versionName "0.1.1"
        ndk { abiFilters 'arm64-v8a' }
    }

    // proot, busybox and friends live in jniLibs and must be real files on disk so that they can be
    // exec'd (Android 10+ only allows executing files from the app's native library directory).
    packagingOptions.jniLibs.useLegacyPackaging true
    // The prebuilt binaries (Termux proot + friends, patchelf'd; static busybox) ship as published: llvm-strip
    // re-lays them out. Only our own build output (libXlorie.so) gets stripped.
    packagingOptions.jniLibs.keepDebugSymbols += ['**/libproot.so', '**/libproot-loader.so', '**/libtalloc.so',
                                                  '**/libandroid-shmem.so', '**/libbusybox.so']

    // Emulator test builds only (gradlew -PbardroidEmulatorX11): also package an x86_64 X server, built by
    // tools\build-emulator-x11.bat, because app_process on an x86_64 emulator cannot load the arm64 one.
    if (project.hasProperty('bardroidEmulatorX11')) {
        sourceSets.main.jniLibs.srcDirs += "${rootDir}/build/emu-x86_64/jnilibs"
        packagingOptions.jniLibs.keepDebugSymbols += ['**/libXlorie_x86_64.so']
    }

    signingConfigs {
        debug {
            // Reproducible dev signing key; replace with your own keystore for release builds.
            storeFile file('bardroid-debug.jks')
            storePassword 'bardroid'
            keyAlias 'bardroid'
            keyPassword 'bardroid'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions.sourceCompatibility JavaVersion.VERSION_17
    compileOptions.targetCompatibility JavaVersion.VERSION_17
    buildFeatures.buildConfig true
}

androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.each { output ->
            output.outputFileName.set("bar-droid-${variant.buildType}.apk")
        }
    }
}

dependencies {
    implementation project(':lorie')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.12.0'
}
